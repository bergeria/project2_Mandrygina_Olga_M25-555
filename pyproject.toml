[tool.poetry]
name = "project2-mandrygina-olga-m25-555"
version = "0.1.0"
description = "HW2"
authors = ["bergeria <o74183047@gmail.com>"]
readme = "README.md"
packages = [
     { include = "src" },
 ]

[tool.poetry.scripts]
project = "src.primitive_db.main:main" 

[tool.poetry.dependencies]
python = "^3.13"
prompt = "^0.4.1"


[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [] 
